name: OnionPlus release

# Host unit tests gate PRs in test.yml. This job uses the Miyoo ARM
# toolchain container and is not wired to make unit-test.
# Each dispatch creates a unique dated GitHub Release. Previous
# releases are kept (no latest-tag overwrite).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain:latest
      options: --user root
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Git config
      run: |
        git config --global --add safe.directory /__w/Onion/Onion
    - name: Get version
      run: |
        MAKE_VERSION=$(make version)
        BASE_VERSION=$(echo "$MAKE_VERSION" | sed -E 's/-[0-9]{8}$//')
        BUILD_DATE=$(date -u +%Y%m%d)
        SHA_SHORT=$(git log -n 1 --pretty=format:"%h" HEAD)
        BUILD_VERSION="${BASE_VERSION}-${BUILD_DATE}"
        {
          echo "BUILD_VERSION=${BUILD_VERSION}"
          echo "SHA_SHORT=${SHA_SHORT}"
          echo "RELEASE_TAG=OnionPlus-v${BUILD_VERSION}-${SHA_SHORT}"
          echo "RELEASE_TITLE=OnionPlus V${BUILD_VERSION}"
          echo "ZIP_NAME=OnionPlus-v${BUILD_VERSION}-${SHA_SHORT}.zip"
        } >> "$GITHUB_ENV"
    - name: Print version
      run: |
        echo "title: ${{ env.RELEASE_TITLE }}"
        echo "tag: ${{ env.RELEASE_TAG }}"
        echo "zip: ${{ env.ZIP_NAME }}"
    - name: Build release
      shell: bash
      run: |
        source /root/.bashrc
        VERSION_OVERRIDE=${{ env.BUILD_VERSION }}-${{ env.SHA_SHORT }} TARGET=OnionPlus make release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TITLE }}
        target_commitish: ${{ github.sha }}
        prerelease: false
        files: release/${{ env.ZIP_NAME }}
        fail_on_unmatched_files: true
